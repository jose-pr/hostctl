[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hostctl"
version = "0.3.2"
authors = [{ name = "Jose A." }]
description = "Run commands and access files on a host, local or remote, protocol-agnostic"
readme = "README.md"
keywords = ["ssh", "sysadmin", "pathlib", "subprocess", "remote"]
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Filesystems",
    "Typing :: Typed",
]
# pathapi supplies the common local/remote path return type. netimps
# supplies scheme/port and address semantics -- including schemes no system
# services database knows (ws/wss, socks5) -- so hostctl does not reimplement
# them. Transport implementations remain extras, so importing hostctl never
# requires them.
#
# Each floor is the `.0` of the dependency's current minor series, raised
# above it only where hostctl needs a later patch. The ceilings stay at the
# next minor because every one of these is pre-1.0, where a minor may break.
# netimps 0.4.0's scheme registry knows winrm/winrms/wsman/wsmans/psrp, so
# `ConnectionString` resolves 5985/5986 for them where 0.3 left the port
# `None`.
dependencies = ["pathapi>=0.1.0,<0.2", "netimps>=0.4.0,<0.5"]

[project.optional-dependencies]
# SSH-backed run()/path(): asyncssh for shell exec, sftppath's SFTPPath for
# the remote path backend. The asyncssh floor is sftppath's own: its
# connection cache calls `SSHClientConnection.is_closed()`, absent before
# 2.20, so an older asyncssh could not serve the path leg.
ssh = ["asyncssh>=2.20,<3", "sftppath[asyncssh]>=0.1.0,<0.2"]
# Windows Remote Management command execution.
winrm = ["pywinrm>=0.5.0,<0.6"]
# PowerShell Remoting Protocol runspaces (Python 3.10+ only).  The marker
# keeps the compatibility floor (Python 3.9) installable with pywinrm alone.
# pypsrp is pre-1.0, so a minor may break: the ceiling is the next minor.
psrp = ["pypsrp>=0.9.0,<0.10; python_version >= '3.10'"]
# Docker Engine-compatible container execution, paths, and sessions.
# docker 7.0 passes the container suite; nothing here needs a 7.1 API.
container = ["docker>=7.0,<8"]
# Raw native, RFC 2217, socket, and virtual serial transports.
# 3.3 is where `serial.Serial` gained `exclusive`, which SerialConfig passes through.
serial = ["pyserial>=3.3,<4"]
# Local libvirt domain lookup and arbitrary QGA commands.
# No ceiling: libvirt-python's major is libvirt's release year, not an API break,
# and the calls used here (open, lookupByName, qemuAgentCommand) are long stable.
qemu-libvirt = ["libvirt-python>=9.0"]
# Optional pywinrm authentication providers. The base winrm extra already
# supports basic/plaintext/ssl and NTLM.
winrm-credssp = ["pywinrm[credssp]>=0.5.0,<0.6"]
winrm-kerberos = ["pywinrm[kerberos]>=0.5.0,<0.6"]
# The `hostctl` command line. 0.7.5 is the floor: it is the first release
# whose tool-call error result carries the exit status (125/126/127) for an
# `_errors_` exception, and 0.7.4 is where `_report_error_` begins.
cli = ["duho>=0.7.5,<0.8"]
# Self-sufficient on purpose: README and the workflows install `.[dev]`
# rather than re-spelling the transport extras, where a missing one makes a
# capability test skip silently. `hostctl[...]` is a self-reference, which
# PEP 508 permits and pip resolves; `psrp`'s own `python_version >= "3.10"`
# marker still keeps it off the 3.9 floor.
dev = [
    "black",
    "build",
    "pytest",
    "hostctl[ssh,winrm,psrp,container,serial,cli]",
]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]"]

[project.urls]
Homepage = "https://github.com/jose-pr/hostctl/"
Documentation = "https://jose-pr.github.io/hostctl/"
Issues = "https://github.com/jose-pr/hostctl/issues"

[project.scripts]
hostctl = "hostctl.cli:main"

[tool.hatch.build.targets.sdist]
# `*.local.*` as well as root dotfiles: an `AGENTS.local.md` beside the
# shipped API header is inside the package directory, which `/.*` does not
# reach. Publishing one is a one-way leak of machine-specific notes.
exclude = ["/.*", "/AGENTS.md", "/benchmarks", "*.local.*", "CLAUDE*"]

[tool.hatch.build.targets.wheel]
packages = ["src/hostctl"]
exclude = ["*.local.*", "CLAUDE*"]

[tool.hatch.build.targets.wheel.force-include]
# Inside the package, so an installed consumer can read it through
# importlib.resources rather than only from a checkout.
"README.md" = "hostctl/README.md"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# `--strict-markers`/`--strict-config` turn a typo into a failure instead of a
# silently-ignored marker; `filterwarnings = ["error"]` is what keeps a
# `ResourceWarning` from a leaked subprocess, or a `DeprecationWarning` from a
# dependency, from scrolling past unread. Add a targeted `ignore::` line with a
# reason rather than softening the default.
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
# An expected failure that starts passing fails the run, so it is noticed.
xfail_strict = true

[tool.black]
target-version = ["py39"]
