name: Test

# On-demand / ad-hoc test workflow, kept separate from release.yml's own
# release-gate test job so it can be run without cutting a release. Two ways
# to trigger it:
#   - workflow_dispatch (optionally against a specific ref), for manual runs.
#   - push of a tag matching "ci-*" (throwaway tag, delete after) so an agent
#     without dashboard access can trigger + poll a run via the API/CLI.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (branch, tag, or SHA)"
        required: false
        default: ""
  push:
    tags:
      - "ci-*"

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with all extras
        run: python -m pip install -e ".[dev]"
      - name: Check formatting
        # One leg: formatting is platform- and version-independent, and
        # running it on all six would report the same thing six times.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: python -m black --check src tests
      - name: Install zsh and fish for the shell corpus
        # The corpus runs each flavour in its real shell and skips a shell
        # that is not installed; the runner image has bash and dash only.
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install --yes zsh fish
      - name: Run tests
        run: python -m pytest -q -rs

  # The declared floors, exercised: every runtime dependency and feature extra
  # installed AT the lower bound pyproject.toml declares (`>=X.Y.0` -> `==X.Y.0`).
  # The matrix above only ever gets the newest releases, so a floor that no
  # longer works would otherwise go unnoticed. 3.10 as well as 3.9: the `psrp`
  # extra is not installed on 3.9, so only 3.10 holds pypsrp at its floor.
  floors:
    name: Floors (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Pin every declared dependency to its floor
        shell: python
        run: |
          import re
          import subprocess
          import sys

          subprocess.run([sys.executable, "-m", "pip", "install", "-q", "tomli"], check=True)
          import tomli

          project = tomli.load(open("pyproject.toml", "rb"))["project"]
          specs = list(project.get("dependencies", []))
          for extra, deps in project.get("optional-dependencies", {}).items():
              if extra not in ("dev", "docs"):
                  specs += deps
          pins = []
          for spec in specs:
              m = re.match(r"^\s*([A-Za-z0-9._-]+)(\[[^\]]*\])?\s*[^;]*?>=\s*([^,;\s]+)", spec)
              if m:
                  pins.append("%s==%s" % (m.group(1), m.group(3)))
          open("floors.txt", "w").write("\n".join(pins) + "\n")
          print("\n".join(pins) or "(no floors declared)")
      - name: Install at the floors
        run: python -m pip install -c floors.txt -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q -rs

  # Build the artifacts a release would publish, so wheel-smoke below can
  # install them.
  package:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # What a user installs is the wheel, not the checkout: install it into a clean
  # environment on each supported OS and check it imports, carries the files it
  # must ship, and that the console script behaves with and without the `cli` extra.
  wheel-smoke:
    name: Installed-wheel smoke (py${{ matrix.python-version }}, ${{ matrix.os }})
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.14"] # oldest + newest supported
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install the wheel into a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          BIN="$RUNNER_TEMP/smoke/bin"; [ "$RUNNER_OS" = Windows ] && BIN="$RUNNER_TEMP/smoke/Scripts"
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          "$BIN/python" -m pip install dist/*.whl
      - name: Import it, find the files it must ship, and check the bare CLI
        # Outside the checkout, so nothing shadows the installed package.
        working-directory: ${{ runner.temp }}
        run: |
          "$BIN/python" - <<'PY'
          import sys
          from importlib.resources import files

          import hostctl

          root = files("hostctl")
          for name in ("py.typed", "AGENTS.md", "README.md"):
              assert (root / name).is_file(), "the wheel does not ship %s" % name
          assert "duho" not in sys.modules, "importing hostctl pulled in the cli extra"
          print("ok:", hostctl.__name__)
          PY
          # Not `! cmd && grep`: under `bash -e` a failing `&&` list does not stop the step.
          if "$BIN/hostctl" --help 2> err.txt; then exit 1; fi
          grep -F "hostctl[cli]" err.txt
      - name: Install the cli extra and run the console script
        run: |
          "$BIN/python" -m pip install "$(ls dist/*.whl)[cli]"
          "$BIN/hostctl" --version
          "$BIN/hostctl" info local:

  conformance-live:
    name: Cross-transport conformance (live Linux legs)
    runs-on: ubuntu-latest
    steps:
      # The dispatched ref, like the test job above. Without it this job
      # silently tested the default branch, so a `workflow_dispatch` on a
      # feature ref reported live results for code that ref did not contain.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Start localhost sshd
        run: |
          sudo apt-get update
          sudo apt-get install --yes openssh-server
          sudo mkdir -p /run/sshd
          mkdir -p "$HOME/.ssh"
          ssh-keygen -q -t ed25519 -N '' -f "$HOME/.ssh/hostctl_conformance"
          cat "$HOME/.ssh/hostctl_conformance.pub" >> "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          sudo service ssh start
      - name: Start Docker conformance container
        run: docker run -d --name hostctl-conformance alpine:3.20 sleep 600
      - name: Install package with transport extras
        run: python -m pip install -e ".[dev]"
      - name: Run conformance battery and live gates
        env:
          HOSTCTL_TEST_DOCKER: "1"
          HOSTCTL_TEST_SSH_LOCAL: "1"
          HOSTCTL_TEST_SSH_USER: runner
          # POSIX here; `windows` points the same fixture at a Windows
          # OpenSSH server, which is the only way to exercise a `cmd`
          # command line delivered to a `cmd.exe` login shell.
          HOSTCTL_TEST_SSH_FLAVOUR: posix
          HOSTCTL_TEST_SSH_KEY: /home/runner/.ssh/hostctl_conformance
          HOSTCTL_TEST_DOCKER_CONTAINER: hostctl-conformance
          # pyserial's own loopback URL: no hardware, no device node. The
          # gate was written as if it needed a real port and was therefore
          # set nowhere, so the live serial leg had never run.
          HOSTCTL_TEST_SERIAL_URI: "serial:///loop%3A%2F%2F"
        run: python -m pytest -q -rs tests/conformance tests/test_serial_live.py

  # pytruenas composes hostctl. Informative until pytruenas has ported to 0.4
  # and this job has been green once; then drop continue-on-error to gate.
  downstream-pytruenas:
    name: "Downstream: pytruenas suite (informative)"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/checkout@v4
        with:
          repository: jose-pr/pytruenas
          ref: main
          path: pytruenas
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # pytruenas first, so this checkout replaces the hostctl it pulls in.
      - name: Install pytruenas, then this checkout over its hostctl
        run: |
          python -m pip install "./pytruenas[dev,config,codegen]"
          python -m pip install -e ".[ssh]"
      - name: Run the pytruenas suite
        run: |
          set -o pipefail
          cd pytruenas
          python -m pytest -q -rf -p no:cacheprovider | tee ../downstream.log
      - name: Summarize
        if: always()
        run: tail -n 1 downstream.log >> "$GITHUB_STEP_SUMMARY"
