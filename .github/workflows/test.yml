name: Test

# On-demand / ad-hoc test workflow, kept separate from release.yml's own
# release-gate test job so it can be run without cutting a release. Two ways
# to trigger it:
#   - workflow_dispatch (optionally against a specific ref), for manual runs.
#   - push of a tag matching "ci-*" (throwaway tag, delete after) so an agent
#     without dashboard access can trigger + poll a run via the API/CLI.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (branch, tag, or SHA)"
        required: false
        default: ""
  push:
    tags:
      - "ci-*"

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with all extras
        run: python -m pip install -e ".[dev,ssh,winrm,psrp,container,serial]"
      - name: Run tests
        run: python -m pytest -q -rs

  conformance-live:
    name: Cross-transport conformance (live Linux legs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Start localhost sshd
        run: |
          sudo apt-get update
          sudo apt-get install --yes openssh-server
          sudo mkdir -p /run/sshd
          mkdir -p "$HOME/.ssh"
          ssh-keygen -q -t ed25519 -N '' -f "$HOME/.ssh/hostctl_conformance"
          cat "$HOME/.ssh/hostctl_conformance.pub" >> "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          sudo service ssh start
      - name: Start Docker conformance container
        run: docker run -d --name hostctl-conformance alpine:3.20 sleep 600
      - name: Install package with transport extras
        run: python -m pip install -e ".[dev,ssh,winrm,psrp,container,serial]"
      - name: Run conformance battery and live gates
        env:
          HOSTCTL_TEST_DOCKER: "1"
          HOSTCTL_TEST_SSH_LOCAL: "1"
          HOSTCTL_TEST_SSH_USER: runner
          HOSTCTL_TEST_SSH_KEY: /home/runner/.ssh/hostctl_conformance
          HOSTCTL_TEST_DOCKER_CONTAINER: hostctl-conformance
        run: python -m pytest -q -rs tests/conformance
