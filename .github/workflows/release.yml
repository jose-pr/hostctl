name: Release

# Runs when a version tag (e.g. v1.0.0, v1.0.0-rc.1) is pushed. Not wired to
# push/PR events on branches -- this is a release gate, not general CI.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A hang fails the job here instead of at the 6 h runner limit; the
    # slowest leg takes about 10 minutes.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.14"] # oldest + newest supported
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with all extras
        run: python -m pip install -e ".[dev]"
      - name: Check formatting
        # One leg: formatting is platform- and version-independent, and
        # running it on all six would report the same thing six times.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: python -m black --check src tests
      - name: Run tests
        run: python -m pytest -q -rs

  # The same job test.yml runs. The declared floors, exercised: every runtime dependency and feature extra
  # installed AT the lower bound pyproject.toml declares (`>=X.Y.0` -> `==X.Y.0`).
  # The matrix above only ever gets the newest releases, so a floor that no
  # longer works would otherwise go unnoticed. 3.10 as well as 3.9: the `psrp`
  # extra is not installed on 3.9, so only 3.10 holds pypsrp at its floor.
  floors:
    name: Floors (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Pin every declared dependency to its floor
        shell: python
        run: |
          import re
          import subprocess
          import sys

          subprocess.run([sys.executable, "-m", "pip", "install", "-q", "tomli"], check=True)
          import tomli

          project = tomli.load(open("pyproject.toml", "rb"))["project"]
          specs = list(project.get("dependencies", []))
          for extra, deps in project.get("optional-dependencies", {}).items():
              if extra not in ("dev", "docs"):
                  specs += deps
          pins = []
          for spec in specs:
              m = re.match(r"^\s*([A-Za-z0-9._-]+)(\[[^\]]*\])?\s*[^;]*?>=\s*([^,;\s]+)", spec)
              if m:
                  pins.append("%s==%s" % (m.group(1), m.group(3)))
          open("floors.txt", "w").write("\n".join(pins) + "\n")
          print("\n".join(pins) or "(no floors declared)")
      - name: Install at the floors
        run: python -m pip install -c floors.txt -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q -rs

  build:
    name: Build distribution
    needs: [test, floors]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install build tooling
        run: python -m pip install --upgrade build twine packaging
      - name: Build sdist and wheel
        run: python -m build
      # A tag on the wrong commit would otherwise publish a release named for
      # one version that carries another version's artifacts.
      - name: The tag names the version that was built
        shell: python
        env:
          TAG: ${{ github.ref_name }}
        run: |
          import os
          import pathlib
          import sys

          from packaging.utils import parse_sdist_filename, parse_wheel_filename
          from packaging.version import Version

          tag = os.environ["TAG"]
          want = Version(tag[1:] if tag.startswith("v") else tag)
          dist = pathlib.Path("dist")
          built = {str(parse_wheel_filename(p.name)[1]) for p in dist.glob("*.whl")}
          built |= {str(parse_sdist_filename(p.name)[1]) for p in dist.glob("*.tar.gz")}
          if built != {str(want)}:
              sys.exit("tag %s is version %s, but dist/ holds %s" % (tag, want, sorted(built)))
          print("tag %s matches the built version %s" % (tag, want))
      - name: Verify sdist and wheel
        run: python -m twine check dist/*
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # What a user installs is the wheel, not the checkout: install it into a clean
  # environment on each supported OS and check it imports, carries the files it
  # must ship, and that the console script behaves with and without the `cli` extra.
  wheel-smoke:
    name: Installed-wheel smoke (py${{ matrix.python-version }}, ${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.14"] # oldest + newest supported
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install the wheel into a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          BIN="$RUNNER_TEMP/smoke/bin"; [ "$RUNNER_OS" = Windows ] && BIN="$RUNNER_TEMP/smoke/Scripts"
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          "$BIN/python" -m pip install dist/*.whl
      - name: Import it, find the files it must ship, and check the bare CLI
        # Outside the checkout, so nothing shadows the installed package.
        working-directory: ${{ runner.temp }}
        run: |
          "$BIN/python" - <<'PY'
          import sys
          from importlib.resources import files

          import hostctl

          root = files("hostctl")
          for name in ("py.typed", "AGENTS.md", "README.md"):
              assert (root / name).is_file(), "the wheel does not ship %s" % name
          assert "duho" not in sys.modules, "importing hostctl pulled in the cli extra"
          print("ok:", hostctl.__name__)
          PY
          # Not `! cmd && grep`: under `bash -e` a failing `&&` list does not stop the step.
          if "$BIN/hostctl" --help 2> err.txt; then exit 1; fi
          grep -F "hostctl[cli]" err.txt
      - name: Install the cli extra and run the console script
        run: |
          "$BIN/python" -m pip install "$(ls dist/*.whl)[cli]"
          "$BIN/hostctl" --version
          "$BIN/hostctl" info local:

  # A GATE, not a deploy. A broken docs site must block the release; owning
  # the deployment here meant a docs fix could not reach the site without a
  # tag, and a transient Pages/OIDC failure turned an otherwise-successful
  # release red AFTER the package was published. `docs.yml` deploys; the
  # `docs-deploy` job at the end dispatches it for this tag.
  docs-gate:
    name: Build documentation strictly (gate only)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install package with docs tooling
        run: python -m pip install -e ".[dev,docs]"
      - name: Build docs
        run: mkdocs build --strict

  github-release:
    name: Create GitHub Release
    needs: [build, docs-gate, wheel-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract CHANGELOG.md section for this tag
        shell: python
        # The tag reaches the script as data (an environment variable), never
        # spliced into its source.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          import os
          import pathlib
          import re
          import sys

          tag = os.environ["TAG"]
          version = tag[1:] if tag.startswith("v") else tag  # v1.0.0-rc.1 -> 1.0.0-rc.1

          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]:\s|\Z)",
              changelog,
              re.DOTALL | re.MULTILINE,
          )
          if not match:
              sys.exit(f"No CHANGELOG.md section found for version {version!r}")
          pathlib.Path("release_notes.md").write_text(match.group(1).strip() + "\n", encoding="utf-8")
      - name: Create GitHub Release
        # Pinned to a commit: this action runs with contents: write.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release_notes.md

  # An -rc.N tag publishes here too, as a PyPI pre-release that pip installs only
  # with --pre (many projects publish final tags only). The departure is
  # recorded in the root AGENTS.md, and docs-deploy still skips pre-releases.
  publish-pypi:
    name: Publish to PyPI
    needs: github-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/hostctl/
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Re-run-safe: without it, a release that failed after uploading
          # some files cannot be retried -- PyPI rejects the whole upload
          # with "File already exists" and the only way forward is a new
          # version number.
          skip-existing: true

  # Events made with the workflow's own GITHUB_TOKEN, such as the release above,
  # start no workflows, so docs.yml cannot listen for the release itself. A
  # workflow_dispatch is the exception: it deploys the docs at this tag. A
  # pre-release leaves the published docs alone. Off the publish chain, so a
  # docs problem never blocks a package that passed its tests.
  docs-deploy:
    name: Deploy the docs for this release
    needs: github-release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch docs.yml at this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
